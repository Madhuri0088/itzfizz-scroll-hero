<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome Itzfizz | Scroll Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --asphalt: #14161a;
      --lane: #2b2f36;
      --paint: #e9e4d8;
      --accent: #ff4d2e;
      --muted: #9aa0aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--asphalt); color: var(--paint); font-family: "Outfit", system-ui, sans-serif; }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Road: dashed centre line that scrolls with progress */
    .road {
      position: absolute;
      inset: -50% 0;               /* taller than viewport so dashes can travel */
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .road__strip {
      width: min(46vw, 520px);
      background: var(--lane);
      position: relative;
      border-left: 3px solid var(--paint);
      border-right: 3px solid var(--paint);
    }
    .road__dashes {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 8px;
      margin-left: -4px;
      background: repeating-linear-gradient(to bottom, var(--paint) 0 70px, transparent 70px 150px);
      will-change: transform;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: clamp(2.5rem, 9vh, 6rem) 1.5rem 0;
      text-align: center;
    }

    .headline {
      font-weight: 700;
      font-size: clamp(1.4rem, 5.2vw, 4.4rem);
      letter-spacing: 0.5em;
      padding-left: 0.5em;          /* optically re-centre trailing tracking */
      line-height: 1.1;
      will-change: transform, opacity;
    }
    .headline .word { display: inline-block; white-space: nowrap; }
    .headline .word + .word { margin-left: 0.9em; }
    .headline .char { display: inline-block; will-change: transform, opacity; }

    /* ---------- Car ---------- */
    .car {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 6vh;
      width: clamp(120px, 15vw, 210px);
      margin-left: calc(clamp(120px, 15vw, 210px) / -2);
      will-change: transform;
      filter: drop-shadow(0 30px 25px rgba(0, 0, 0, 0.55));
    }
    .car svg { display: block; width: 100%; height: auto; }

    /* ---------- Stats ---------- */
    .stats {
      position: absolute;
      z-index: 2;
      left: 0; right: 0;
      top: 38vh;
      padding: 0 clamp(1rem, 5vw, 5rem);
      display: grid;
      grid-template-columns: 1fr 1fr;
      pointer-events: none;
    }
    .stats__side { display: flex; flex-direction: column; gap: clamp(1.5rem, 6vh, 4rem); }
    .stats__side--left  { align-items: flex-start; text-align: left;  }
    .stats__side--right { align-items: flex-end;   text-align: right; }

    .stat { max-width: 15rem; will-change: transform, opacity; }
    .stat__value {
      font-size: clamp(2.6rem, 7vw, 6rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat__value span { color: var(--accent); font-weight: 500; }
    .stat__label { margin-top: 0.5rem; color: var(--muted); font-size: clamp(0.8rem, 1.2vw, 1rem); line-height: 1.35; }

    /* ---------- Content after hero ---------- */
    .after {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem;
      text-align: center;
      background: var(--paint);
      color: var(--asphalt);
    }
    .after h2 { font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 500; max-width: 24ch; }

    @media (max-width: 640px) {
      .headline { letter-spacing: 0.3em; padding-left: 0.3em; }
      .stats { top: 34vh; }
      .road__strip { width: 70vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .car, .road__dashes { will-change: auto; }
    }
  </style>
</head>
<body>

  <section class="hero" id="hero" aria-label="Hero">
    <div class="road" aria-hidden="true">
      <div class="road__strip"><div class="road__dashes"></div></div>
    </div>

    <div class="hero__content">
      <h1 class="headline" id="headline" aria-label="Welcome Itzfizz">
        <span class="word" aria-hidden="true">WELCOME</span><span class="word" aria-hidden="true">ITZFIZZ</span>
      </h1>
    </div>

    <div class="stats">
      <div class="stats__side stats__side--left">
        <div class="stat">
          <div class="stat__value"><b data-count="58">0</b><span>%</span></div>
          <p class="stat__label">Increase in pick up point use</p>
        </div>
        <div class="stat">
          <div class="stat__value"><b data-count="27">0</b><span>%</span></div>
          <p class="stat__label">Increase in pick up point use</p>
        </div>
      </div>
      <div class="stats__side stats__side--right">
        <div class="stat">
          <div class="stat__value"><b data-count="23">0</b><span>%</span></div>
          <p class="stat__label">Decreased in customer phone calls</p>
        </div>
        <div class="stat">
          <div class="stat__value"><b data-count="40">0</b><span>%</span></div>
          <p class="stat__label">Decreased in customer phone calls</p>
        </div>
      </div>
    </div>

    <!-- Inline SVG top-view car: swap for an <img> of your own PNG if you prefer -->
    <div class="car" id="car" aria-hidden="true">
      <svg viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg">
        <!-- wheels -->
        <rect x="6"   y="62"  width="26" height="68" rx="9" fill="#0b0b0d"/>
        <rect x="168" y="62"  width="26" height="68" rx="9" fill="#0b0b0d"/>
        <rect x="6"   y="288" width="26" height="76" rx="9" fill="#0b0b0d"/>
        <rect x="168" y="288" width="26" height="76" rx="9" fill="#0b0b0d"/>
        <!-- body -->
        <path d="M100 8 C150 8 172 40 176 90 C180 150 176 300 172 350 C168 396 140 412 100 412 C60 412 32 396 28 350 C24 300 20 150 24 90 C28 40 50 8 100 8Z" fill="#ff4d2e"/>
        <!-- hood + engine cover lines -->
        <path d="M60 60 C80 40 120 40 140 60 L136 150 L64 150Z" fill="#e0401f"/>
        <!-- cabin / windscreen -->
        <path d="M58 150 C76 138 124 138 142 150 L148 205 L52 205Z" fill="#101318"/>
        <rect x="52" y="205" width="96" height="62" rx="12" fill="#1c2027"/>
        <path d="M52 267 L148 267 L142 312 C124 322 76 322 58 312Z" fill="#101318"/>
        <!-- mirrors -->
        <rect x="14"  y="158" width="16" height="10" rx="4" fill="#e0401f"/>
        <rect x="170" y="158" width="16" height="10" rx="4" fill="#e0401f"/>
        <!-- headlights -->
        <path d="M44 34 L72 28 L70 42 L48 50Z" fill="#fff6d6"/>
        <path d="M156 34 L128 28 L130 42 L152 50Z" fill="#fff6d6"/>
        <!-- tail lights -->
        <rect x="46"  y="384" width="30" height="8" rx="4" fill="#ff1f1f"/>
        <rect x="124" y="384" width="30" height="8" rx="4" fill="#ff1f1f"/>
      </svg>
    </div>
  </section>

  <section class="after">
    <h2>Scroll back up to watch it drive in reverse.</h2>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---------- 1. Split headline into characters (for staggered reveal) ---------- */
    document.querySelectorAll("#headline .word").forEach((word) => {
      const text = word.textContent;
      word.textContent = "";
      [...text].forEach((ch) => {
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = ch;
        word.appendChild(span);
      });
    });

    /* ---------- 2. Initial load animation ---------- */
    const intro = gsap.timeline({ defaults: { ease: "power3.out" } });

    intro
      .from(".headline .char", {
        yPercent: 60,
        autoAlpha: 0,
        duration: reduceMotion ? 0.01 : 0.9,
        stagger: 0.05,
      })
      .from(".car", {
        yPercent: 40,
        autoAlpha: 0,
        duration: reduceMotion ? 0.01 : 1.1,
      }, "-=0.6")
      .from(".stat", {
        y: 30,
        autoAlpha: 0,
        duration: reduceMotion ? 0.01 : 0.8,
        stagger: 0.18,                 // one by one
      }, "-=0.5");

    // Count-up numbers, in sync with each stat appearing
    document.querySelectorAll("[data-count]").forEach((el, i) => {
      const target = Number(el.dataset.count);
      const counter = { v: 0 };
      intro.to(counter, {
        v: target,
        duration: reduceMotion ? 0.01 : 1.2,
        ease: "power2.out",
        onUpdate: () => (el.textContent = Math.round(counter.v)),
      }, 1.3 + i * 0.18);
    });

    /* ---------- 3. Scroll-driven animation (tied to scroll progress) ---------- */
    if (!reduceMotion) {
      const scroll = gsap.timeline({
        defaults: { ease: "none" },
        scrollTrigger: {
          trigger: "#hero",
          start: "top top",
          end: "+=200%",              // 2 extra screens of scroll distance
          pin: true,
          scrub: 1.2,                 // smooth catch-up = interpolation/easing
          anticipatePin: 1,
        },
      });

      scroll
        // Car drives "up the road" and grows as it approaches
        .to("#car", { yPercent: -120, scale: 1.7, rotation: 0, ease: "power1.inOut" }, 0)
        .fromTo("#car", { rotation: -2 }, { rotation: 2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0)
        // Road dashes rush past the car
        .to(".road__dashes", { y: 600, ease: "none" }, 0)
        // Headline spreads out and fades away
        .to(".headline", { letterSpacing: "1.1em", yPercent: -40, autoAlpha: 0 }, 0.15)
        // Stats drift outwards, then fade
        .to(".stats__side--left .stat",  { x: -120, autoAlpha: 0, stagger: 0.1 }, 0.4)
        .to(".stats__side--right .stat", { x:  120, autoAlpha: 0, stagger: 0.1 }, 0.4);
    }
  </script>
</body>
</html>
